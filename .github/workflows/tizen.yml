name: Build Tizen TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tizen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check signing secrets
        env:
          CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
          CERT_AUTHOR_BASE64: ${{ secrets.TIZEN_AUTHOR_CERT_BASE64 }}
          CERT_DISTRIBUTOR_BASE64: ${{ secrets.TIZEN_DISTRIBUTOR_CERT_BASE64 }}
        run: |
          if [ -z "$CERT_PASSWORD" ]; then
            echo "::error::Set the repository Actions secret TIZEN_CERT_PASSWORD to the shared password of the Samsung author and distributor certificates."
            exit 1
          fi
          if [ -z "$CERT_AUTHOR_BASE64" ] || [ -z "$CERT_DISTRIBUTOR_BASE64" ]; then
            echo "::error::Set TIZEN_AUTHOR_CERT_BASE64 and TIZEN_DISTRIBUTOR_CERT_BASE64."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build:tizen -- --env youtube --env autoupdate

      - name: Sign the widget
        env:
          CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
          CERT_AUTHOR_BASE64: ${{ secrets.TIZEN_AUTHOR_CERT_BASE64 }}
          CERT_DISTRIBUTOR_BASE64: ${{ secrets.TIZEN_DISTRIBUTOR_CERT_BASE64 }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VARIANT=_youtube_autoupdate bash platforms/tizen/package.sh "$VERSION" release

      - name: Upload widget and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tizen-tv
          path: |
            release/*.wgt
            release/*.wgt.sha256
          if-no-files-found: error
